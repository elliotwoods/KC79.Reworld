# The CEF renderer/GPU/utility-process helper.
#
# Not packaging boilerplate, and not optional: Cargo does not build binary targets belonging to
# a dependency, while `av_gui_shell::run` returns `SubprocessMissing` unless `av-gui-subprocess`
# sits beside the application executable. Copied from PortalFlasher's, which is itself the
# framework's template; do not replace it with a build script that hopes Cargo will build a
# dependency's binary.
#
# This bench only opens a composed window off Windows -- see `PortalTestBench/av-app.toml` and
# `OperatorApp::UI` in portal-test-bench -- so on Windows the helper is built and never launched.
# Building it there anyway is deliberate: `check-av-app.ps1` reads the manifest, not the target,
# and a helper that exists only on one platform is a helper nobody notices is missing on the
# other.
[package]
name = "av-gui-subprocess"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
av-gui-cef-sys = { path = "../../third_party/av-frameworks/crates/av-gui-cef-sys" }
