[package]
name = "bench-core"
description = "Portal bench behaviour: transports, test engine, verdicts, flashing policy. No GUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Deliberately no `av-*` dependency of any kind. This crate is the whole of the bench's
# behaviour, and it must stay runnable -- and testable -- with no probe, no serial port, no
# board and no browser. It is also what lets `ptb --local` own the hardware with no GUI.
#
# `router-link` rather than `router-core`: the link is all this needs, and the rest of
# router-core would drag ffmpeg-sidecar, rosc, tiny_http, ab_glyph and glam into a bench tool.
[dependencies]
router-proto = { workspace = true }
router-report = { workspace = true }
router-link = { workspace = true }
serde = { workspace = true }
serialport = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }

[dependencies.portal-swd]
workspace = true
optional = true

[features]
default = ["swd"]
# SWD flashing via probe-rs. Behind a feature so a headless soak or a CI run of the engine does
# not have to link probe-rs and its USB stack at all.
swd = ["dep:portal-swd"]
