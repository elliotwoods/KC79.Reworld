contract_version = 1
class = "operator-app"

# The widest window kind this application can open, which is what the contract asks us to
# declare (application-contract.md, 1a) and what `check-av-app.ps1` reads.
#
# It is not the whole truth on every platform, and the manifest has no platform axis to say so.
# `OperatorApp::UI` in crates/portal-test-bench narrows to `control-window` on Windows, where
# nothing is drawn underneath this page -- the live plots are canvas in the DOM, and there is no
# camera, no 3D and no video -- and the composed window's compositor, CEF payload and helper
# subprocess would all be cost with nothing bought.
#
# Off Windows there is no such choice to make. `av-gui-webview` declares `tao`/`wry` under
# `cfg(windows)` alone, and `av-operator-app` answers `NativeUnavailable` for `control-window`
# elsewhere before it binds. So the kind declared here is `composed-window`, this workspace
# carries `crates/av-gui-subprocess` (AVAPP111-114), and the Windows build simply never launches
# the helper it ships.
ui = "composed-window"

native_default = true
headless_supported = true
rust_binary = "portal-test-bench"
web_manifest = "web/package.json"
web_entry = "web/src/main.tsx"

# This product's own acceptance inventory. There is no `preview` surface because there is no
# camera; `live-telemetry` takes its place, because a bench that cannot show the module moving
# while it moves is a log viewer.
required_surfaces = [
  "module-state",
  "transport",
  "test-runner",
  "live-telemetry",
  "firmware",
  "session-log",
  "faults",
]
