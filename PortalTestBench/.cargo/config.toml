[net]
git-fetch-with-cli = true

# ---------------------------------------------------------------------------------------------
# CEF's undefined symbols, on macOS.
#
# ## Why this file needs them at all
#
# `av-gui-cef-sys` `dlopen`s the CEF framework at run time (`shim/av_cef_loader_mac.c` says why),
# so these `cef_*` symbols are undefined when *this* workspace's executables are linked -- not
# when the shim's own rlib is produced, which is the only place a `cargo:rustc-link-arg` from its
# build script would reach. Without them `portal-test-bench`, `ptb` and `av-gui-subprocess` all
# fail at link on macOS with "symbol(s) not found for architecture arm64".
#
# It has to live here rather than being inherited. `.cargo/config.toml` is read from the invoked
# workspace's directory upwards, and the framework's own copy sits *below* this workspace root,
# so nothing here ever sees it.
#
# ## Keeping it in step with the framework
#
# **Not hand-written.** Generated by `nm -u` over the compiled shim objects, per the instructions
# in `third_party/av-frameworks/crates/av-gui-cef-sys/shim/cef-undefined-symbols.txt`:
#
#     nm -u $(find target/debug/build -name '*.o' -path '*av-gui-cef-sys*') \\
#         | grep '^_cef_' | sed 's/^_//' | sort -u
#
# At framework revision 0f24de7 that yields 16 symbols, and this list is identical to the
# framework's own. **Regenerate after moving `framework.lock`** -- and note that it has been out of
# step before: at the previous pin (21fd9b6) both the framework's list and its config carried only
# 13, missing the three the shim's `on_render_process_message` calls. Since 0f24de7 the crate's
# build.rs runs the same `nm` itself and fails the build when the two disagree, so a *future* drift
# announces itself. That guard did not exist when this file was written, which is why the
# regeneration command is recorded here rather than assumed.
#
# **Not `-undefined dynamic_lookup`.** The blanket form allows every undefined symbol in the final
# executable, so a shim function nobody compiled would link cleanly and fail at run time. The
# framework tree shipped exactly that defect once. One `-U` per symbol keeps full link checking
# for everything else, which is what would have caught it.
#
# Nothing here applies to a Windows build, which reads none of it.

[target.aarch64-apple-darwin]
rustflags = [
    "-Clink-arg=-Wl,-U,_cef_api_hash",
    "-Clink-arg=-Wl,-U,_cef_browser_host_create_browser",
    "-Clink-arg=-Wl,-U,_cef_do_message_loop_work",
    "-Clink-arg=-Wl,-U,_cef_execute_process",
    "-Clink-arg=-Wl,-U,_cef_get_exit_code",
    "-Clink-arg=-Wl,-U,_cef_initialize",
    "-Clink-arg=-Wl,-U,_cef_quit_message_loop",
    "-Clink-arg=-Wl,-U,_cef_run_message_loop",
    "-Clink-arg=-Wl,-U,_cef_shutdown",
    "-Clink-arg=-Wl,-U,_cef_string_userfree_utf16_free",
    "-Clink-arg=-Wl,-U,_cef_string_utf16_clear",
    "-Clink-arg=-Wl,-U,_cef_string_utf16_to_utf8",
    "-Clink-arg=-Wl,-U,_cef_string_utf8_clear",
    "-Clink-arg=-Wl,-U,_cef_string_utf8_to_utf16",
    "-Clink-arg=-Wl,-U,_cef_v8_value_create_bool",
    "-Clink-arg=-Wl,-U,_cef_v8_value_create_double",
]

[target.x86_64-apple-darwin]
rustflags = [
    "-Clink-arg=-Wl,-U,_cef_api_hash",
    "-Clink-arg=-Wl,-U,_cef_browser_host_create_browser",
    "-Clink-arg=-Wl,-U,_cef_do_message_loop_work",
    "-Clink-arg=-Wl,-U,_cef_execute_process",
    "-Clink-arg=-Wl,-U,_cef_get_exit_code",
    "-Clink-arg=-Wl,-U,_cef_initialize",
    "-Clink-arg=-Wl,-U,_cef_quit_message_loop",
    "-Clink-arg=-Wl,-U,_cef_run_message_loop",
    "-Clink-arg=-Wl,-U,_cef_shutdown",
    "-Clink-arg=-Wl,-U,_cef_string_userfree_utf16_free",
    "-Clink-arg=-Wl,-U,_cef_string_utf16_clear",
    "-Clink-arg=-Wl,-U,_cef_string_utf16_to_utf8",
    "-Clink-arg=-Wl,-U,_cef_string_utf8_clear",
    "-Clink-arg=-Wl,-U,_cef_string_utf8_to_utf16",
    "-Clink-arg=-Wl,-U,_cef_v8_value_create_bool",
    "-Clink-arg=-Wl,-U,_cef_v8_value_create_double",
]
