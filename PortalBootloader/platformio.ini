; The RS485 field-update bootloader, built from the imported STM32CubeIDE sources.
;
; The sources in `cube-import/` are **not touched**. Everything the port needs is expressed here
; and in `bootloader.ld`, so `git diff` against the import commit shows the whole of what porting
; changed — which was the point of importing it unmodified in the first place. Rewriting includes
; and shuffling files into src/ would have worked too, and would have made the diff between "what
; ST's IDE built" and "what this builds" impossible to read.
;
; Four things below are not obvious and each one cost time to establish. They are recorded in
; `protocol-hardening.md` §7.3; the comments here say why they are where they are.

[platformio]
name = PortalBootloader
description = KC79 Portal RS485 field-update bootloader
; Point the build straight at the imported tree rather than copying sources into src/.
src_dir = cube-import/Core
include_dir = cube-import/Core/Inc

[env:bootloader]
platform = ststm32
board = nucleo_g070rb
board_build.mcu = stm32g070rbt6
framework = stm32cube

; Required, and silent when missing. Without it the framework compiles against its own
; `stm32g0xx_hal_conf.h` and the one in `cube-import/Core/Inc` — which is where this project
; decides which HAL modules exist at all — is ignored. The build still succeeds.
board_build.stm32cube.custom_config_header = yes

; The 24 kB bank, and the reason this file exists rather than reusing the imported one: the
; original says `LENGTH = 28K` for a bank the bootloader itself treats as 24 kB
; (`BOOTLOADER_SIZE` in `Core/Src/constants.h`). At 22,708 bytes the difference has never
; mattered, and a link that is allowed to run 4 kB into the application bank is not something to
; keep once it has been noticed.
board_build.ldscript = bootloader.ld

build_src_filter =
	+<Src/*.c>
	+<Src/*.cpp>
	; The framework supplies startup_stm32g070xx.s and system_stm32g0xx.c from CMSIS, generated
	; from the same ST template as the imported ones. Compiling both is a duplicate-symbol link
	; error, and there is no switch to suppress the framework.s, so the imported pair is excluded.
	-<Src/system_stm32g0xx.c>
	; And `syscalls.c` duplicates libnosys, which this link line pulls in and CubeIDE.s did not.
	; `sysmem.c` stays: it is the real `_sbrk`, where libnosys.s only fails.
	-<Src/syscalls.c>
	+<msgpack-arduino/msgpack/*.cpp>

build_flags =
	-Icube-import/Core/Src
	-Icube-import/Core/msgpack-arduino
	-Os
	; GCC 7 LTO incorrectly resolves the startup object's weak IRQ aliases instead of the strong
	; handlers in stm32g0xx_it.c. The resulting image verifies byte-for-byte but traps on its first
	; SysTick. The non-LTO image is 19.4 kB, still safely inside the bootloader's 24 kB bank.
	-fno-lto
	; The imported sources include "msgpack.hpp" expecting the library root on the path, which is
	; how it resolves inside CubeIDE's own include list.
	-DUSE_HAL_DRIVER
	-DSTM32G070xx

; -Wl,--gc-sections is already in the framework's link line.

upload_protocol = stlink
monitor_speed = 115200

; Backward-compatible alias for scripts which used the old comparison-only environment. The
; production build is now also non-LTO because the LTO image has invalid interrupt vectors.
[env:bootloader_nolto]
extends = env:bootloader
