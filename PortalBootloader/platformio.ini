; The RS485 field-update bootloader.
;
; Two environments, and the split between them is the design:
;
;   `bootloader`  the STM32G070 image. src/core + src/target.
;   `native`      the same src/core, compiled for the host, with `lib/bltest`'s fakes in place of
;                 src/target and the real msgpack sources underneath. `pio test -e native`.
;
; Everything that decides whether to erase flash or jump to an address lives in src/core and is
; therefore exercised by a suite that runs in a second on a laptop. That matters more here than in
; most firmware: this image can only be replaced with a debug probe, so a defect that reaches a
; board is a defect that needs a bench, a cable and physical access to fix.

[platformio]
name = PortalBootloader
description = KC79 Portal RS485 field-update bootloader
src_dir = src
include_dir = include

[env]
build_flags =
	; `Messaging.cpp` reaches for sprintf to report a parse error over the same stream that just
	; failed to parse. 1.9 kB of newlib formatting for a diagnostic nobody reads.
	-D MSGPACK_DISABLE_ERROR_REPORT
; The canonical msgpack-arduino, as a submodule, shared with PortalFW. The 2023 vendored snapshot
; that used to live in cube-import/ had drifted: a 64-byte COBS decode buffer against the
; submodule's 256, a hand-rolled double buffer against its lwrb ring, and no running CRC at all --
; so the frame trailer this bootloader now verifies did not exist in the copy it was built from.
lib_extra_dirs = ../PortalFW/lib
lib_deps = msgpack-arduino

[env:bootloader]
; Pinned, and it has to be. Unpinned, PlatformIO resolves whatever `ststm32` release a machine
; already carries, and the compiler comes with it: two machines then produce two different images
; from one commit, and the git sha recorded beside them says nothing about which.
;
; 19.6.0 resolves GCC 7.2.1 for framework-stm32cube. Older than the 10.3 CubeIDE used, which is
; the opposite of what one would guess, and it is why -fno-lto below is not optional.
platform = ststm32@19.6.0
board = nucleo_g070rb
board_build.mcu = stm32g070rbt6
; CMSIS headers, the startup object and system_stm32g0xx.c come from here, along with the LL
; headers this build uses instead of the HAL. No HAL module is enabled: see
; include/stm32g0xx_hal_conf.h, which is empty of them on purpose.
framework = stm32cube
; Required, and silent when missing. Without it the framework compiles against its own
; stm32g0xx_hal_conf.h and ours -- the file that decides which HAL modules exist at all -- is
; ignored, and roughly 6 kB of HAL arrives that nothing calls.
board_build.stm32cube.custom_config_header = yes
board_build.ldscript = bootloader.ld

build_src_filter = +<core/*> +<target/*>

build_flags =
	${env.build_flags}
	-Os
	; GCC 7's LTO resolves the startup object's weak IRQ aliases in preference to the strong
	; handlers, so the vector table ends up pointing every interrupt at Default_Handler. The image
	; verifies byte-for-byte and traps on its first SysTick.
	-fno-lto
	-DSTM32G070xx
	; No guard variables around function-local statics. There is one thread; the guard is a
	; word of .bss and a pair of library calls per static, for nothing.
	;
	; Note there is deliberately no -fno-use-cxa-atexit here: it substitutes plain `atexit` for
	; `__cxa_atexit`, and both reach newlib's heap. src/target/runtime.cpp stubs the registration
	; instead, which is what actually keeps malloc out of the image.
	-fno-threadsafe-statics
	-Wall -Wextra
	-Wl,-Map,${BUILD_DIR}/firmware.map
	-Wl,--print-memory-usage

extra_scripts = post:tools/size_gate.py

upload_protocol = stlink
monitor_speed = 115200

[env:native]
platform = native
; src/target is STM32-only; lib/bltest supplies the same seam for the host.
build_src_filter = +<core/*>
build_flags =
	${env.build_flags}
	-std=gnu++14
	-g -O1
	-DBL_NATIVE
	-Wall -Wextra
	-Iinclude
test_build_src = yes
test_framework = unity
