[workspace]
resolver = "3"
members = [
    "crates/portal-flasher",
    "crates/portal-swd",
    "crates/av-gui-subprocess",
]
# The framework is a pinned checkout, not a workspace member. Cargo would otherwise auto-enrol
# it and resolve features over a subgraph that is not the one either tree was tested against.
exclude = ["third_party/av-frameworks"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Path dependencies into the pinned framework checkout. One checkout feeds both ecosystems:
# these, and web/package.json's `file:` dependency on the same directory.
av-gui-bus = { path = "third_party/av-frameworks/crates/av-gui-bus" }
av-gui-host = { path = "third_party/av-frameworks/crates/av-gui-host" }
av-gui-shell = { path = "third_party/av-frameworks/crates/av-gui-shell" }
av-operator-app = { path = "third_party/av-frameworks/crates/av-operator-app" }
av-app-icon = { path = "third_party/av-frameworks/crates/av-app-icon" }

axum = "0.8"
# One job: read `g_liveness_counter`'s address out of firmware.elf's symbol table. Trimmed to the
# ELF reader — no writing, no DWARF, no Mach-O/PE — which is a few hundred lines of parsing rather
# than the whole crate. Hand-rolling it was the alternative; this is a format where a bounds check
# missed in an unusual file is a real bug, and getting that wrong to save a dependency would be a
# poor trade.
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "std"] }
# Pinned exactly: 0.32.0 is the only 0.32.x release, and the API this is written against was
# verified signature-by-signature at that tag.
#
# `default-features = false` drops `cmsisdap_v1`, which is the only thing pulling in the `hidapi`
# C dependency. ST-Link is bulk USB via `nusb` and needs none of it. `builtin-targets` is what
# carries the STM32G070RBTx description; `builtin-formats` is deliberately absent because raw
# bytes go through `FlashLoader::add_data`, not `load_image`.
probe-rs = { version = "=0.32.0", default-features = false, features = ["builtin-targets"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

[profile.dev.package."*"]
debug = "line-tables-only"

[profile.dev.build-override]
debug = 0
