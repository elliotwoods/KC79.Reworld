[package]
name = "portal-swd"
description = "SWD flashing of KC79 Portal boards: the rig state machine, image bundles, and the probe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["probe"]
# The real hardware backend. Off, the crate still builds and everything except `ProbeRsRig` still
# works -- which keeps the state machine, the image model and their tests buildable on a machine
# with no USB stack at all.
probe = ["dep:probe-rs"]

# Deliberately no av-* dependency. Everything the rig knows how to do is testable from a plain
# `cargo test`, and usable from a CLI, without the GUI stack being present at all.
[dependencies]
object = { workspace = true }
probe-rs = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
