[platformio]
default_envs = repeater

[env:repeater]
; pioarduino 55.03.311 pins Arduino-ESP32 3.3.11 / ESP-IDF 5.5.5, matching
; the toolchain recorded in the recovered field image.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_size = 4MB
board_build.partitions = default.csv
board_build.f_flash = 80000000L
board_build.flash_mode = dio
monitor_speed = 115200
extra_scripts = pre:tools/set_build_metadata.py
build_flags =
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
	-D CORE_DEBUG_LEVEL=0
	-D REPEATER_VERSION=\"3.0.0\"
	-D REPEATER_SIDE1_INVERT=0
	-D REPEATER_SIDE2_INVERT=0

[env:native]
platform = native
test_framework = unity
build_flags =
	-D REPEATER_VERSION=\"test\"
