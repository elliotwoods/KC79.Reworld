; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
; Pinned for the same reason PortalBootloader's is, and with the same consequence if it is not:
; unpinned, PlatformIO resolves whatever `ststm32` release the machine already carries, and the
; compiler comes with it. Two machines then produce two different binaries from one commit, and
; the git sha a package records alongside them says nothing about which.
;
; 17.6.0 resolves framework-arduinoststm32 2.8.1 and GCC 12.3.1. It is pinned here because it is
; what the images in this tree were built and range-checked with, not because a later release is
; known to be wrong -- raising it is a one-line change plus a rebuild, a size check, and a board.
platform = ststm32@17.6.0
; The registry no longer carries framework-arduinoststm32 4.20801.0 (Arduino core 2.8.1),
; which is what 17.6.0 asks for, so the pin above cannot be resolved from it any more.
; Fetch that exact core from its own tag instead: same core, same compiler, pin intact.
platform_packages =
	framework-arduinoststm32 @ https://github.com/stm32duino/Arduino_Core_STM32.git#2.8.1
board = nucleo_g070rb
framework = arduino
lib_deps = 
	olikraus/U8g2@^2.35.4
	msgpack-arduino
	u8g2stm32

build_flags =
	; 64 bytes -- the stm32duino default -- is 5.5 ms of wire at 115200, and a nine-entry keyframe
	; is 225 bytes while a 128-byte firmware chunk is ~176. Neither fits, so the application has to
	; drain the ring while the frame is still arriving, which it only does while App::update() is
	; running. Any longer stall (the OLED redraw is the big one) loses bytes mid-frame, and a
	; truncated COBS frame reads downstream as corruption rather than as loss. 256 is the ceiling
	; before the ring index widens to 16 bits, and buys 22 ms.
	-D SERIAL_RX_BUFFER_SIZE=256
	-D U8X8_NO_HW_SPI
	-D U8X8_NO_HW_I2C
	-D MSGPACK_DISABLE_ERROR_REPORT
	-Os
	; The flash map, and the CRC every durable record on this board is checked with, shared with
	; the bootloader so the two images cannot disagree about where the application bank ends.
	-I../PortalBootloader/include

debug_build_flags =
	-O1
	-g -ggdb
	-D GUI_DISABLED

; 128kB flash, 36kB RAM
board_build.mcu = stm32g070rbt6

upload_protocol = stlink

monitor_speed = 115200

; Two PCB revisions are in production: v6 (default, optical home-switch sensor) and
; v4 (rev-1 mechanical home switches, built with -D HOME_SWITCH_LEGACY -- see
; src/Modules/HomeSwitch.h for the typedef this flag selects). Each variant gets its
; own bank-offset env so both produce independently discoverable
; .pio/build/<env>/firmware.bin artifacts for PortalFlasher to offer as a manual
; board-type choice (there's no hardware strap to auto-detect which PCB is attached).

; Everything a bank build shares. The three numbers here were previously spread across
; set_bank2.py, board_upload settings and the linker script, and one of them (the flash limit)
; was being set in a way the linker script did not read -- see layout_check.py, which now asserts
; all of them against the shared header before the build starts.
[app_bank]
board_build.ldscript = ldscript_app.ld
; 0x1E800: the application bank ends at the first durable page, not at the end of flash. Those
; three pages hold the provisioning serial and the A/B settings journals.
board_upload.maximum_size = 124928
; 36 KiB - 32. The top 32 bytes are the handoff block the application leaves for the bootloader;
; shortening RAM is what keeps the stack out of it.
board_upload.maximum_ram_size = 36832
extra_scripts = pre:set_build_date.py
	pre:layout_check.py

; ---- Bootloader v6 boards, application at 0x08004000 -------------------------------------------
;
; 8 kB larger than the legacy bank, because the v6 bootloader is 16 kB rather than 24 kB.

[env:application_bank_optical]
extends = app_bank
build_flags = ${env.build_flags}
board_build.flash_offset = 0x4000
board_upload.offset_address = 0x08004000

[env:application_bank_mechanical]
extends = app_bank
build_flags =
	${env.build_flags}
	-D HOME_SWITCH_LEGACY
board_build.flash_offset = 0x4000
board_upload.offset_address = 0x08004000

; Bring-up build for a board whose homing has never run before. Identical to
; application_bank_optical except that STARTUP_INIT_DISABLED suppresses Routines::startup(), so the
; board comes up talking but commands no motion at all -- see App.cpp, where that macro guards
; exactly one call.
;
; Why that matters: as shipped, App::setup() runs a full init() (measureCycle + calibrate, i.e.
; homing on both axes) before the first App::update(), so a board is moving before anything can be
; asked of it, and a run where every attempt fails blocks for ~20 minutes (tryCount retries plus
; the warm re-run, per axis). This env lets the sensor be characterised with 'd' and the prisms
; jogged with 0-9 first, then homing triggered deliberately with 'c' and aborted with ESC.
;
; Not for production: a board flashed with this will never home on its own.
[env:application_bank_optical_bringup]
extends = app_bank
build_flags =
	${env.build_flags}
	-D STARTUP_INIT_DISABLED
board_build.flash_offset = 0x4000
board_upload.offset_address = 0x08004000

; ---- Bootloader v4/v5 boards, application at 0x08006000 ----------------------------------------
;
; The transition builds. A board still carrying the old bootloader runs its application here, and
; a v6 bootloader will also start an image here when the new bank is blank -- which is the state a
; board is in between having its bootloader replaced and having its application re-uploaded.
; Without these, updating a fleet would be a flag day.

; GUI_DISABLED on both of these, and it is not an optimisation.
;
; The legacy bank is 8 kB smaller than the new one, and the application has since grown a 16 kB
; bootloader-image receiver. With the OLED driver in, the legacy-base build overflows its bank by
; a couple of hundred bytes -- the linker says so, which is the whole reason the FLASH length in
; ldscript_app.ld was worth fixing.
;
; Dropping the display is the right thing to drop rather than the easiest. This build exists to be
; the one step between a board running the old bootloader and a board running the new one: it
; receives a bootloader image, installs it, and resets. It is on a board for minutes. Nothing reads
; its screen, and everything that does matter -- RS485, the ID chain, provisioning identity,
; motion -- is untouched.

[env:application_bank_optical_legacy_base]
extends = app_bank
build_flags =
	${env.build_flags}
	-D GUI_DISABLED
board_build.flash_offset = 0x6000
board_upload.offset_address = 0x08006000

[env:application_bank_mechanical_legacy_base]
extends = app_bank
build_flags =
	${env.build_flags}
	-D HOME_SWITCH_LEGACY
	-D GUI_DISABLED
board_build.flash_offset = 0x6000
board_upload.offset_address = 0x08006000

[env:debug_no_bootloader]
; Note that if you try to debug with the bootloader,
; then the IWDG will reboot the mcu when you pause the flow of the program.
; So you basically have to use the no bootloader version for debugging

build_type = debug
extra_scripts = pre:set_build_date.py
build_flags = --specs=nano.specs

[env:no_bootloader]
extra_scripts = pre:set_build_date.py