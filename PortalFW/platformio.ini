; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = ststm32
board = nucleo_g070rb
framework = arduino
lib_deps = 
	olikraus/U8g2@^2.35.4
	msgpack-arduino
	u8g2stm32

build_flags =
	-D U8X8_NO_HW_SPI
	-D U8X8_NO_HW_I2C
	-D MSGPACK_DISABLE_ERROR_REPORT
	-Os

debug_build_flags =
	-O1
	-g -ggdb
	-D GUI_DISABLED

; 128kB flash, 36kB RAM
board_build.mcu = stm32g070rbt6

upload_protocol = stlink

monitor_speed = 115200

; Two PCB revisions are in production: v6 (default, optical home-switch sensor) and
; v4 (rev-1 mechanical home switches, built with -D HOME_SWITCH_LEGACY -- see
; src/Modules/HomeSwitch.h for the typedef this flag selects). Each variant gets its
; own bank-offset env so both produce independently discoverable
; .pio/build/<env>/firmware.bin artifacts for PortalFlasher to offer as a manual
; board-type choice (there's no hardware strap to auto-detect which PCB is attached).

[env:application_bank_optical]
board_upload.offset_address = 0x08006000 ; Note we're offset by 24kB
extra_scripts = set_bank2.py
	pre:set_build_date.py

[env:application_bank_mechanical]
board_upload.offset_address = 0x08006000 ; Note we're offset by 24kB
build_flags =
	${env.build_flags}
	-D HOME_SWITCH_LEGACY
extra_scripts = set_bank2.py
	pre:set_build_date.py

; Bring-up build for a board whose homing has never run before. Identical to
; application_bank_optical (same bank offset, same optical variant) except that
; STARTUP_INIT_DISABLED suppresses Routines::startup(), so the board comes up talking but
; commands no motion at all -- see App.cpp, where that macro guards exactly one call.
;
; Why that matters: as shipped, App::setup() runs a full init() (measureCycle + calibrate,
; i.e. homing on both axes) before the first App::update(), so a board is moving before
; anything can be asked of it, and a run where every attempt fails blocks for ~20 minutes
; (tryCount retries plus the warm re-run, per axis). This env lets the sensor be
; characterised with 'd' and the prisms jogged with 0-9 first, then homing triggered
; deliberately with 'c' and aborted with ESC.
;
; Not for production: a board flashed with this will never home on its own.
[env:application_bank_optical_bringup]
board_upload.offset_address = 0x08006000 ; Note we're offset by 24kB
build_flags =
	${env.build_flags}
	-D STARTUP_INIT_DISABLED
	; Production current (0.25 A, the default) rather than the gentler 150 mA this env started
	; with. 150 mA was chosen as a safe first-run setting on bench evidence that 100-250 mA are
	; indistinguishable for slip and homing precision -- but that evidence came from a different
	; axis on a different rig. On this unit axis A is unaffected while axis B measures its own
	; revolution as anywhere between 168k and 188k microsteps against a true 189.7k, i.e. it is
	; losing steps, which is what "no flag in a whole revolution" actually looks like from the
	; sensor's point of view.
extra_scripts = set_bank2.py
	pre:set_build_date.py

[env:debug_no_bootloader]
; Note that if you try to debug with the bootloader,
; then the IWDG will reboot the mcu when you pause the flow of the program.
; So you basically have to use the no bootloader version for debugging

build_type = debug
extra_scripts = pre:set_build_date.py
build_flags = --specs=nano.specs

[env:no_bootloader]
extra_scripts = pre:set_build_date.py