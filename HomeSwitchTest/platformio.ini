; Standalone bench tooling for the optical home switch.
;
; This is a SEPARATE PlatformIO project that lives outside PortalFW so the
; production firmware is left pristine. It reuses the real
; Modules::HomeSwitchOptical (and its Base) without copying them: src/Modules
; is a symlink to ../../PortalFW/src/Modules, and each env's build_src_filter
; compiles only the files it needs plus its own entry point.
;
; Local libraries (msgpack-arduino, u8g2stm32) are pulled straight from
; PortalFW/lib via lib_extra_dirs.
;
; Environments:
;   home_switch_test  - sweeps the threshold to find each axis's crossing duty
;                       (calibration). Entry point: src/main.cpp. Uses the OLED.
;   home_switch_track - holds the threshold fixed and tracks the A/B comparator
;                       outputs in realtime, streaming a 1-byte binary frame at
;                       up to 60 Hz. Entry point: src/tracker_main.cpp. No OLED.
;   home_switch_bench - unified Side-A rig: live sensor + settable threshold +
;                       Axis-A motor jog/goto + two-edge homing, driven over a
;                       bidirectional ASCII line protocol by monitor/home_switch_gui.py.
;                       Entry point: src/bench_main.cpp. Reuses MotorDriver +
;                       MotorDriverSettings (see bench_log_stub.cpp for why).

[env]
platform = ststm32
board = nucleo_g070rb
framework = arduino
board_build.mcu = stm32g070rbt6
upload_protocol = stlink
monitor_speed = 115200

lib_extra_dirs = ../PortalFW/lib
; Shared by both envs. The OLED libs (U8g2, u8g2stm32) are added only by the
; sweep env below, so the tracker build stays lean and never compiles them.
lib_deps =
	msgpack-arduino

build_flags =
	-D U8X8_NO_HW_SPI
	-D U8X8_NO_HW_I2C
	-D MSGPACK_DISABLE_ERROR_REPORT
	-Os
	-I../PortalFW/src
	-I../PortalFW/lib/u8g2stm32

; Each env lists ONLY its entry point + the two reused modules. The symlinked
; src/Modules also contains GUI.cpp, App.cpp, etc.; an explicit include list
; leaves them (and the other env's main) out of the build.

[env:home_switch_test]
lib_deps =
	${env.lib_deps}
	olikraus/U8g2@^2.35.4
	u8g2stm32
build_src_filter =
	+<main.cpp>
	+<../../PortalFW/src/Modules/HomeSwitchOptical.cpp>
	+<../../PortalFW/src/Modules/Base.cpp>

[env:home_switch_track]
lib_deps =
	${env.lib_deps}
	olikraus/U8g2@^2.35.4
	u8g2stm32
build_src_filter =
	+<tracker_main.cpp>
	+<../../PortalFW/src/Modules/HomeSwitchOptical.cpp>
	+<../../PortalFW/src/Modules/Base.cpp>

[env:home_switch_bench]
lib_deps =
	${env.lib_deps}
	olikraus/U8g2@^2.35.4
	u8g2stm32
build_src_filter =
	+<bench_main.cpp>
	+<BenchMotion.cpp>
	+<bench_log_stub.cpp>
	+<../../PortalFW/src/Modules/HomeSwitchOptical.cpp>
	+<../../PortalFW/src/Modules/MotorDriver.cpp>
	+<../../PortalFW/src/Modules/MotorDriverSettings.cpp>
	+<../../PortalFW/src/Modules/Base.cpp>
