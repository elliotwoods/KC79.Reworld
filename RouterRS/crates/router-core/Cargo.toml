[package]
name = "router-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GUI-free domain model, configuration, servers and runtime for the RouterRS app"

[dependencies]
router-proto = { path = "../router-proto" }
router-link = { path = "../router-link" }
router-report = { path = "../router-report" }
glam = "0.29"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
